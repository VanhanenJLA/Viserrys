<tweet class="card mt-2">

  <tweet-header class="card-header py-1">

    <div class="row">

      <div class="col-auto">
        <chip th:replace="components/chip.html :: chip(account=${tweet.sender})"></chip>
      </div>

      <div class="col align-self-center">
        <div class="row justify-content-between">

          <div class="col"></div>

          <span class="col-auto text-muted pr-3 timestamp"
                th:text="${tweet.timestamp}"></span>

        </div>
      </div>
    </div>

  </tweet-header>

  <div class="card-body">
    <span th:text="${tweet.content}"></span>
  </div>

</tweet>
